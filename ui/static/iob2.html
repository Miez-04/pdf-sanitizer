<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IOB2 inspector · PDF Sanitizer</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<style>
:root {
  /* palette: cool paper, navy ink, stamp-ink blue, marker yellow */
  --paper: #EDF0F5; --desk: #DDE3EE; --sheet: #FFFFFF;
  --ink: #121C33; --ink-soft: #46526B; --rule: #D3DAE6;
  --stamp: #2447D6; --stamp-dark: #1A36A8; --marker: #FFD54A;
  /* names the older rules, inline styles and scripts still use */
  --purple: var(--stamp); --purple-dark: var(--stamp-dark);
  --bg: var(--paper); --card-bg: #FFFFFF; --text: var(--ink); --text-muted: var(--ink-soft); --border: var(--rule);
  /* entity colours: unchanged, they match the boxes on the page */
  --person: #16a34a; --nric: #2563eb; --phone: #7c3aed; --address: #dc2626; --other: #d97706;
  /* system fonts only: this tool runs offline and must not fetch anything */
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --mono: "Cascadia Mono", Consolas, "SFMono-Regular", ui-monospace, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--sans); font-size: 15px; line-height: 1.45; color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 3px solid var(--stamp); outline-offset: 2px; }

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; gap: 22px; padding: 12px 28px; background: #fff; border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 11px; font-family: var(--serif); font-weight: 600; font-size: 21px; letter-spacing: -0.005em; color: var(--ink); text-decoration: none; }
.brand .logo { width: 36px; height: 36px; flex: none; display: block; }
.topnav { display: flex; gap: 4px; }
.navlink { color: var(--ink-soft); font-size: 14px; font-weight: 600; text-decoration: none; padding: 7px 12px; border-radius: 8px; }
.navlink:hover { background: var(--bg); color: var(--ink); }
.navlink[aria-current="page"] { color: var(--stamp-dark); background: #E6ECFF; }
.topbar-actions { display: flex; gap: 10px; margin-left: auto; }

/* ---------- buttons ---------- */
button { font: inherit; cursor: pointer; border: none; border-radius: 10px; }
button:active:not(:disabled) { transform: translateY(1px); }
.btn-primary { background: var(--stamp); color: #fff; padding: 10px 18px; font-weight: 650; box-shadow: 0 1px 0 rgba(18,28,51,.2); }
.btn-primary:hover { background: var(--stamp-dark); }
.btn-primary:disabled { background: #9DB0EC; cursor: not-allowed; }
.btn-secondary { background: #fff; color: var(--ink); padding: 10px 16px; border: 1px solid var(--border); font-weight: 600; }
.btn-secondary:hover { background: #F4F6FB; border-color: #B9C3D8; }

/* ---------- inspector ---------- */
.controls { background: #fff; margin: 22px 28px 14px; padding: 18px 22px; border: 1px solid var(--border); border-radius: 16px; display: flex; align-items: center; gap: 14px 22px; flex-wrap: wrap; }
.controls label { font-size: 13px; font-weight: 650; color: var(--text-muted); }
.controls input[type=file] { font-size: 13px; max-width: 260px; }
.controls input[type=file]::file-selector-button { font: inherit; font-weight: 650; font-size: 13px; background: var(--bg); color: var(--ink); border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; margin-right: 10px; cursor: pointer; }
.controls input[type=file]::file-selector-button:hover { background: #E2E8F3; }
.controls input[type=text] { padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; width: 280px; font-family: var(--mono); background: #fff; color: var(--ink); }
.controls .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.controls .checkbox-row input { accent-color: var(--stamp); width: 16px; height: 16px; }
.controls .checkbox-row label { color: var(--ink); }
.controls #run-btn { margin-left: auto; }

.switch-row { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 650; cursor: pointer; user-select: none; color: var(--ink); }
.switch { position: relative; width: 44px; height: 24px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch .slider { position: absolute; inset: 0; background: #AEB8CE; border-radius: 24px; transition: background .15s; }
.switch .slider::before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.switch input:checked + .slider { background: var(--stamp); }
.switch input:checked + .slider::before { transform: translateX(20px); }
.switch input:focus-visible + .slider { outline: 3px solid var(--stamp-dark); outline-offset: 2px; }
.switch-state { font-weight: 700; min-width: 28px; font-family: var(--mono); font-size: 13px; }

button { background: var(--stamp); color: #fff; padding: 10px 18px; font-weight: 650; font-size: 13px; }
button:hover { background: var(--stamp-dark); }
button:disabled { background: #9DB0EC; cursor: not-allowed; }
button.secondary { background: #fff; color: var(--ink); border: 1px solid var(--border); }
button.secondary:hover:not(:disabled) { background: #F4F6FB; border-color: #B9C3D8; }
button.secondary:disabled { background: #fff; color: #9AA5BC; border-color: var(--border); }

#status { margin: 0 28px 10px; font-size: 13px; color: var(--text-muted); min-height: 1.4em; }

.filter-row { margin: 0 28px 14px; display: flex; gap: 10px; align-items: center; }
.filter-row input[type=text] { flex: 1; max-width: 340px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: #fff; }
.filter-row #download-btn { margin-left: auto; }
.filter-row select { padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: #fff; color: var(--ink); }

.page-block { background: #fff; margin: 0 28px 20px; border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
.page-block h3 { margin: 0; padding: 13px 18px; background: #F6F8FC; font-family: var(--serif); font-size: 16px; font-weight: 600; border-bottom: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 9px 14px; background: #F6F8FC; color: var(--text-muted); font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; border-bottom: 1px solid var(--border); position: sticky; top: 0; }
td { padding: 6px 14px; border-bottom: 1px solid #EEF1F6; font-variant-numeric: tabular-nums; }
tr:hover td { background: #F2F5FA; }
.token-cell { font-family: var(--mono); }
.label-O { color: #8793AB; }
.label-PERSON { color: var(--person); font-weight: 700; }
.label-NRIC { color: var(--nric); font-weight: 700; }
.label-PHONE { color: var(--phone); font-weight: 700; }
.label-ADDRESS { color: var(--address); font-weight: 700; }
tr:has(.label-PERSON) td { background: rgba(22,163,74,.07); }
tr:has(.label-NRIC) td { background: rgba(37,99,235,.07); }
tr:has(.label-PHONE) td { background: rgba(124,58,237,.07); }
tr:has(.label-ADDRESS) td { background: rgba(220,38,38,.07); }
.source-regex { color: var(--nric); }
.source-model { color: var(--stamp); }
.source-address_heuristic { color: var(--address); }
.source-none { color: var(--text-muted); }
.hidden-row { display: none; }

#empty-state { margin: 56px 28px; text-align: center; color: var(--text-muted); }
#empty-state svg { width: 64px; height: 64px; opacity: .9; margin-bottom: 14px; }
#empty-state p { margin: 0; font-size: 15px; }

@media (max-width: 760px) {
  .controls { margin: 16px; } .controls #run-btn { margin-left: 0; }
  .filter-row, #status { margin-left: 16px; margin-right: 16px; } .page-block { margin: 0 16px 16px; overflow-x: auto; }
  .topbar { padding: 10px 16px; }
}
@media (prefers-reduced-motion: reduce) { .switch .slider, .switch .slider::before { transition: none; } }

</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="/" aria-label="PDF Sanitizer home"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <path d="M15 5h22l15 15v36a4 4 0 0 1-4 4H15a4 4 0 0 1-4-4V9a4 4 0 0 1 4-4z" fill="#FFFFFF" stroke="#121C33" stroke-width="3" stroke-linejoin="round"/>
  <path d="M37 5v11a4 4 0 0 0 4 4h11" fill="#DCE3F5" stroke="#121C33" stroke-width="3" stroke-linejoin="round"/>
  <rect x="18" y="24" width="17" height="3.2" rx="1.6" fill="#8A97B4"/>
  <rect x="17" y="31" width="29" height="7" rx="1.8" fill="#121C33"/>
  <rect x="17" y="41" width="15" height="7" rx="1.8" fill="#121C33"/>
  <circle cx="47" cy="48" r="9.5" fill="#2447D6" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M42.6 48.2l3.1 3.1 5.7-6.2" fill="none" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<span>PDF Sanitizer</span></a>
  <nav class="topnav">
    <a class="navlink" href="/">Sanitize</a>
    <a class="navlink" href="/iob2" aria-current="page">IOB2 inspector</a>
  </nav>
</header>

<div class="controls">
  <label for="file-input">PDF file</label>
  <input type="file" id="file-input" accept="application/pdf">
  <div class="checkbox-row">
    <input type="checkbox" id="no-model-check">
    <label for="no-model-check">Tier 1 only (no model)</label>
  </div>
  <label class="switch-row" for="heuristic-toggle">
    <span>Address heuristic</span>
    <span class="switch"><input type="checkbox" id="heuristic-toggle" checked><span class="slider"></span></span>
    <span class="switch-state" id="heuristic-state">ON</span>
  </label>
  <label for="checkpoint-input">Checkpoint</label>
  <input type="text" id="checkpoint-input" placeholder="models/checkpoints_v25_ns/best_model.pt">
  <button onclick="runAnalysis()" id="run-btn">Run</button>
</div>

<div id="status" role="status" aria-live="polite"></div>

<div class="filter-row" id="filter-row" style="display:none;">
  <input type="text" id="search-input" placeholder="Filter tokens…" aria-label="Filter tokens" oninput="applyFilter()">
  <select id="label-filter" aria-label="Filter by label" onchange="applyFilter()">
    <option value="">All labels</option>
    <option value="PERSON">PERSON</option>
    <option value="NRIC">NRIC</option>
    <option value="PHONE">PHONE</option>
    <option value="ADDRESS">ADDRESS</option>
    <option value="O">O only</option>
  </select>
  <button class="secondary" onclick="downloadPlain()" id="download-btn" disabled>Download plain .txt</button>
</div>

<div id="empty-state"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <path d="M15 5h22l15 15v36a4 4 0 0 1-4 4H15a4 4 0 0 1-4-4V9a4 4 0 0 1 4-4z" fill="#FFFFFF" stroke="#121C33" stroke-width="3" stroke-linejoin="round"/>
  <path d="M37 5v11a4 4 0 0 0 4 4h11" fill="#DCE3F5" stroke="#121C33" stroke-width="3" stroke-linejoin="round"/>
  <rect x="18" y="24" width="17" height="3.2" rx="1.6" fill="#8A97B4"/>
  <rect x="17" y="31" width="29" height="7" rx="1.8" fill="#121C33"/>
  <rect x="17" y="41" width="15" height="7" rx="1.8" fill="#121C33"/>
  <circle cx="47" cy="48" r="9.5" fill="#2447D6" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M42.6 48.2l3.1 3.1 5.7-6.2" fill="none" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<p>Choose a PDF and press Run to see its token-by-token IOB2 tags.</p></div>
<div id="results"></div>

<script>
let lastFilename = "";
let lastPages = [];

async function runAnalysis() {
  const fileInput = document.getElementById("file-input");
  if (!fileInput.files.length) {
    setStatus("Choose a PDF file first.");
    return;
  }
  const runBtn = document.getElementById("run-btn");
  runBtn.disabled = true;
  setStatus("Running pipeline…");
  document.getElementById("results").innerHTML = "";
  document.getElementById("empty-state").style.display = "none";

  const form = new FormData();
  form.append("file", fileInput.files[0]);
  form.append("no_model", document.getElementById("no-model-check").checked ? "true" : "false");
  form.append("address_heuristic", document.getElementById("heuristic-toggle").checked ? "true" : "false");
  const checkpoint = document.getElementById("checkpoint-input").value.trim();
  if (checkpoint) form.append("checkpoint", checkpoint);

  try {
    const res = await fetch("/api/iob2-dump", { method: "POST", body: form });
    const data = await res.json();
    runBtn.disabled = false;
    if (!res.ok) {
      setStatus("Error: " + (data.error || res.statusText));
      return;
    }
    lastFilename = data.filename;
    lastPages = data.pages;
    setStatus(`${data.filename} — ${data.pages.length} page(s) — address heuristic: ${data.address_heuristic ? "ON" : "OFF"}`);
    document.getElementById("filter-row").style.display = "flex";
    document.getElementById("download-btn").disabled = false;
    renderPages(data.pages);
  } catch (err) {
    runBtn.disabled = false;
    setStatus("Error: " + err.message);
  }
}

function setStatus(msg) {
  document.getElementById("status").textContent = msg;
}

function renderPages(pages) {
  const container = document.getElementById("results");
  container.innerHTML = "";
  pages.forEach(page => {
    const block = document.createElement("div");
    block.className = "page-block";
    const h3 = document.createElement("h3");
    h3.textContent = `Page ${page.page}`;
    block.appendChild(h3);

    const table = document.createElement("table");
    table.innerHTML = `
      <thead><tr>
        <th>Token</th><th>Label</th><th>Source</th><th>Conf</th><th>Block</th><th>Line</th>
      </tr></thead>`;
    const tbody = document.createElement("tbody");
    page.tokens.forEach(t => {
      const labelType = t.label === "O" ? "O" : t.label.split("-")[1];
      const sourceClass = `source-${t.source || "none"}`;
      const tr = document.createElement("tr");
      tr.dataset.token = t.text.toLowerCase();
      tr.dataset.label = labelType;
      tr.innerHTML = `
        <td class="token-cell">${escapeHtml(t.text)}</td>
        <td class="label-${labelType}">${t.label}</td>
        <td class="${sourceClass}">${t.source || "-"}</td>
        <td>${t.confidence != null ? t.confidence.toFixed(2) : "-"}</td>
        <td>${t.block}</td>
        <td>${t.line}</td>`;
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    block.appendChild(table);
    container.appendChild(block);
  });
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function applyFilter() {
  const query = document.getElementById("search-input").value.toLowerCase();
  const labelFilter = document.getElementById("label-filter").value;
  document.querySelectorAll("#results tbody tr").forEach(tr => {
    const matchesQuery = !query || tr.dataset.token.includes(query);
    const matchesLabel = !labelFilter || tr.dataset.label === labelFilter;
    tr.classList.toggle("hidden-row", !(matchesQuery && matchesLabel));
  });
}

function downloadPlain() {
  if (!lastPages.length) return;
  let text = "";
  lastPages.forEach(page => {
    page.tokens.forEach(t => { text += `${t.text} ${t.label}\n`; });
    text += "\n";
  });
  const blob = new Blob([text], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = (lastFilename || "dump").replace(/\.pdf$/i, "") + "_iob2.txt";
  a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>

<script>
// keep the ON/OFF text next to the slider in step with the slider itself
(function () {
  var t = document.getElementById("heuristic-toggle");
  t.addEventListener("change", function () {
    document.getElementById("heuristic-state").textContent = t.checked ? "ON" : "OFF";
  });
})();
</script>
